[project]
name = "ostentatiousmachine"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ostentatiousmachinegh", email = "ostentatiousmachinegh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
]

[tool.maturin]
module-name = "ostentatiousmachine._core"
python-packages = ["ostentatiousmachine"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
